name: guide
description: "Guide plugin"
prefix: GUIDE
version: "${version}"

main: io.github.kiber2009.plugin.guide.GuidePlugin
api-version: "${mc_version}"
load: POSTWORLD

authors: [ Kiber2009, AnotherGuy ]
website: https://example.com/

commands:
  calculator:
    description: Калькулятор
    aliases:
      - calc
      - калькулятор
    usage: /<command> <n1> <+|-|*|/> <n2>
    permission: guide.calculator
    permission-message: Недостаточно прав
  allow:
    usage: /<command> <permission>
  comp:

permissions:
  guide.calculator:
    description: Использование калькулятора
    default: op
    children:
      - guide.calculator.add
      - guide.calculator.substract
      - guide.calculator.multiply
      - guide.calculator.divide
  guide.echo:
    default: not op

default-permission: false